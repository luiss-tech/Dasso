<!-- Input component examples -->
<div class="form-controls">
  <label class="label" for="example-text">Campo de texto</label>
  <input id="example-text" class="input" type="text" placeholder="Escribe aquí" />

  <label class="label" for="example-select">Selector</label>
  <select id="example-select" class="select">
    <option>Opción A</option>
    <option>Opción B</option>
  </select>

  <label class="label" for="example-textarea">Descripción</label>
  <textarea id="example-textarea" class="textarea" rows="4"></textarea>
</div>
